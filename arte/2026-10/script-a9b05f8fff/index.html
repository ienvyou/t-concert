var D=[{"n": 1, "title": "대한민국 AI·클라우드, 수순이 맞는가?", "time": "0:00~1:00", "steps": 0, "note": "오프닝. 9월에 '대한민국 클라우드, 수순이 맞는가?'로 발표했던 내용의 10월 개정판입니다. 제목에 'AI'를 더했습니다 — 2주 사이 질문이 클라우드를 넘어 에이전트·로봇·보안까지 번졌기 때문입니다. 오른쪽 스택은 오늘 반복될 그림이고, 주황색이 부가가치와 Lock-in이 생기는 위층입니다.", "app": false}, {"n": 2, "title": "추석 이후 2주 — 세 개의 신호", "time": "1:00~3:15", "steps": 1, "note": "추석 연휴가 끼어 있던 2주를 세 줄로 요약합니다. 첫째, 메타 뮤즈 — 예약·결제를 대신하는 개인 에이전트가 10일 만에 앱스토어 1위가 됐고, 아마존이 이를 막았고, OpenAI가 Dots로 따라왔습니다. 둘째, 9월 30일부터 은행·캐피탈 7곳이 연쇄로 털렸고, 공격 서버에서 LLM 침투도구 흔적이 나왔습니다 — AI 사용은 아직 확정이 아닙니다. 셋째, 국감에서 정부 GPU가 절반만 돈다는 숫자가 나왔고, OpenAI 매출 보도로 반도체주가 흔들렸습니다. (클릭) 그래서 오늘 질문을 이렇게 고칩니다 — 가치는 더 위로, 위험은 더 넓게, 우리는 여전히 아래층 숫자로 성과를 말한다. 수순은 맞는가.", "app": false}, {"n": 3, "title": "AI는 지금 어디까지 왔나 — 모델·에이전트·몸", "time": "3:15~5:00", "steps": 1, "note": "지금 AI가 어디 있는지 세 전선으로 봅니다. 모델은 9월 한 달에만 7개 계열이 나왔습니다 — 3~4주마다 바뀝니다. 토큰 단가는 내려가는데 작업당 비용은 오르기도 한다는 점을 기억해 주세요. 에이전트는 이제 '답하는' 게 아니라 '대신 실행'합니다. 기업 시장에선 좌석 과금이 사용량·성과 과금으로 바뀌고 있습니다. 몸, 피지컬 AI는 출하는 늘었지만 대부분 중국산이고 현장은 아직 학습 단계입니다. (클릭) 모델 격차는 몇 주면 좁혀집니다. 오래 남는 차이는 무엇을 맡기고, 어떻게 검증하고, 무엇이 바뀌었는지를 설계하는 쪽에서 생깁니다.", "app": false}, {"n": 4, "title": "부가가치와 Lock-in은 Stack의 위쪽에서 만들어진다", "time": "5:00~6:15", "steps": 3, "note": "오늘의 렌즈입니다. 7계층. (클릭) 위 4개는 소프트웨어·데이터·API로 고객을 묶는 곳 — 마진·Lock-in·차별화. (클릭) 아래 3개는 CAPEX·전력·감가상각으로 싸우는 곳 — 가격이 곧 경쟁력입니다. (클릭) 질문은 각자 어느 층에 돈을 쓰고, 어디가 비어 있느냐. 미국과 중국은 순서는 달랐지만 둘 다 수요를 만드는 위층이 먼저였고 인프라는 그 수요를 따라갔습니다 — 자세한 비교는 부록 4·5. 그런데 9월에 이 그림 맨 위에 한 층이 더 생겼습니다. 다음 장입니다.", "app": false}, {"n": 5, "title": "뮤즈 쇼크 — 스택 위에 한 층이 더 생겼다", "time": "6:15~8:15", "steps": 3, "note": "뮤즈를 별도로 다루는 이유는 스택 그림이 바뀌기 때문입니다. (클릭) 맨 위에 한 층이 생겼습니다 — '누가 사용자 대신 클릭하는가'. 검색창이 아니라 에이전트가 구매 의도를 먼저 받습니다. 그래서 애널리스트들이 구글 광고를 걱정합니다. (클릭) 아마존이 막은 이유는 표면적으론 보안이지만, 본질은 고객 접점을 넘길 것인가입니다. 이 질문은 네이버·카카오·쿠팡·은행에도 곧 옵니다 — 문을 열 API를 줄 건가, 막을 건가, 우리 에이전트를 낼 건가. (클릭) 그리고 편의와 위임 권한은 같은 속도로 커집니다 — 출시 2주 만에 제로데이가 나왔습니다. 한국 출시는 미정입니다.", "app": false}, {"n": 6, "title": "피지컬 AI — 로봇 '대수'는 GPU '장수'의 반복이 될 수 있다", "time": "8:15~9:45", "steps": 2, "note": "피지컬 AI. 2027 정부안에 3.1조가 잡혔고 휴머노이드 공공구매 250대가 들어 있습니다. 그런데 과기정통부 AI 예산 중 피지컬 비중은 4.9%, 핵심부품 국산화는 40% 남짓, 그리고 로봇 파운데이션 모델은 처음 보는 일을 5% 확률로 해냅니다. (클릭) 글로벌이 돈을 쓰는 곳은 로봇 대수가 아니라 '데이터 공장'입니다 — 현대차 RMAC에서 Atlas는 아직 학습 중이고, NVIDIA는 시뮬레이션 계층을 쥡니다. (클릭) 한국의 진짜 강점은 공장이라는 현장입니다. 성과지표가 구매 대수와 실증 개소 수라면 GPU 26만장과 같은 길을 갑니다.", "app": false}, {"n": 7, "title": "우리는 지금 GPU를 사고, 데이터센터를 짓고 있다", "time": "9:45~11:00", "steps": 1, "note": "여기서부터 초판의 뼈대입니다, 숫자는 10월 기준으로 갱신했습니다. 26만장은 여전히 계획입니다. 과기정통부 AI 예산은 5.1조에서 9.4조로 늘었고, 그중 컴퓨팅 자원이 3.85조입니다. 내년엔 베라 루빈 1만장에 3.9조가 새로 들어갑니다. 해남 국가AI컴퓨팅센터는 8월에 착공했습니다. (클릭) 그런데 — GPU가 많아지면 강해지는가?", "app": false}, {"n": 8, "title": "GPU는 반만 돈다 — 국감이 확인한 '사용'의 증거", "time": "11:00~13:00", "steps": 4, "note": "초판에서 저는 '가동률 50% 미만이면 방향을 바꾸자'는 임계치를 가정으로 제시했습니다. 10월 국감에서 그 숫자가 나왔습니다. 정부 지원 GPU 월평균 활용률 약 50%. (클릭) 작년 HPC 지원 GPU는 71.5%가 50% 미만이었습니다. (클릭) 그런데 산·학·연 신청 대비 배정은 30.8%뿐입니다 — 신청은 넘치는데 배정된 건 놉니다. 부족한 건 GPU가 아니라 쓸 수 있게 만드는 계층입니다. (클릭) 정부 답은 회수·재배분. (클릭) 그런데 내년엔 1만장을 더 삽니다. 회수·재배분은 스케줄러지 수요가 아닙니다. 활용률 정의가 기관마다 다를 수 있다는 단서는 붙여 주세요.", "app": false}, {"n": 9, "title": "한국: 인프라가 먼저, 위층은 비어 있다", "time": "13:00~14:15", "steps": 3, "note": "그래서 한국의 순서입니다. (클릭) 주황이 한국의 투자·정책·담론이 몰린 곳 — 반도체·AIDC·GPU, 아래층입니다. (클릭) 표의 한국 열: 출발점도 아래층, 2027 예산도 컴퓨팅 3.85조에 피지컬은 4.9% — 아래층 단독이고, 비어 있는 층은 플랫폼·SaaS·활용 환경입니다. 왜 이 순서가 문제인지 — 마진은 위에서 나오고, 컴퓨트는 매년 싸지고, GPU 임대만으론 적자가 커진다는 근거는 부록 6~10에 있습니다. (클릭) 정답 순서를 말하려는 게 아니라, 아래층 투자가 위층 사용으로 이어지는 연결이 설계돼 있느냐를 묻는 것입니다.", "app": false}, {"n": 10, "title": "공격도 에이전트가 한다 — 추석 직후 금융권 연쇄 침해", "time": "14:15~16:15", "steps": 4, "note": "추석 직후 금융권 연쇄 침해입니다. 신한은행에서 대출모집인 서비스 본인확인을 우회당했고, 공격 서버에 'AI 자율 침투테스트 콘솔'이라는 문자열이 있었습니다. 다만 AI가 실제로 쓰였는지는 당국이 확정하지 않았습니다 — 이 단서는 반드시 말해 주세요. (클릭) 정부는 비상체제로 들어갔습니다. (클릭) 제가 강조하고 싶은 건 공통 진입점이 코어가 아니라 가장자리 — 모집인·외주·직원용 모바일 — 였다는 점입니다. (클릭) 글로벌 보고서는 이미 에이전트가 공격을 지휘하는 단계라고 말합니다. (클릭) 그리고 9월 11일부터 과징금 상한이 매출 10%입니다. 보안은 AI 다음 과제가 아니라 AI의 전제가 됐습니다. (덧붙여, 국정자원 화재가 꼭 1년 됐습니다 — 핵심 시스템 DR은 아직 진행 중이고, 자세한 건 부록 11.)", "app": false}, {"n": 11, "title": "한국 AI가 잘못 바라보는 8가지 착시", "time": "16:15~18:15", "steps": 1, "note": "오늘의 핵심 장입니다. 한국 AI가 잘못 바라보는 여덟 가지는 사실 한 패턴입니다 — 세기 쉬운 숫자를 성과로 착각하는 것. GPU 장수, 벤치마크 점수, MAU, 로봇 대수, 에이전트 개수, '보안은 나중', 토큰 단가, '거품이면 기다리자'. 오른쪽 열이 10월 뉴스의 반례입니다. '모두의 AI' 목표가 MAU 1,500만으로 나온 것(부록 13), 주권을 GPU 장수로만 보는 것(부록 12)도 같은 패턴입니다. 독파모 3차 평가가 '사용성'으로 바뀐 건 긍정적인 신호로 짚어 주세요. (클릭) 한 줄로 — 산 것과 만든 것을 세지 말고, 바뀐 것을 세라. 이제 이 패턴을 우리 같은 소프트웨어 기업의 일로 옮겨 보겠습니다.", "app": false}, {"n": 12, "title": "소프트웨어 기업은 스택의 어디에 서 있나", "time": "18:15~20:30", "steps": 2, "note": "여기서부터는 소프트웨어를 파는 우리 이야기입니다. 오늘 본 8계층 위에 소프트웨어·보안 솔루션 영역을 겹쳐 보면, 맨 아래 칩을 빼고 거의 모든 층 사이에 '게이트웨이'가 있습니다. 맨 위 개인 에이전트 층엔 에이전트 식별과 허용 정책, AX엔 섀도 AI 가시화, AI 플랫폼엔 AI·MCP 게이트웨이, 인프라엔 추론 트래픽 관리와 DPU 오프로드. (클릭) 그래서 우리 업계에 네 가지가 바뀌고 있습니다. 라이선스와 박스에서 구독과 사용량으로, 층이 늘수록 게이트웨이가 늘고, 기능 데모에서 before/after 측정으로, 구매자는 IT팀에서 CISO·AI팀·현업으로. (클릭) AI 인프라 투자는 하드웨어·인프라 매출을 먼저 키웁니다 — 한국의 GPU 붐과 같은 구조죠. 그 위에 구독과 AI 보안, 에이전트 게이트웨이를 더하면 고객과의 관계가 길고 깊어집니다. 인프라 딜마다 위층을 함께 제안하는 것, 그게 우리의 기회입니다. 해석은 제 의견입니다.", "app": false}, {"n": 13, "title": "10월 뉴스를 고객 대화로 바꾸기", "time": "20:30~23:15", "steps": 1, "note": "오늘 앞에서 본 10월 뉴스 여섯 개를 그대로 고객 대화로 바꿨습니다. 규칙은 하나 — 제품부터 꺼내지 말고 질문부터, 그리고 질문은 고객의 숫자로 끝나야 합니다. AIDC 사업자에겐 'GPU를 더 사기 전에 이미 산 GPU의 토큰 수율은?' — 여기서 추론 트래픽 관리와 DPU 오프로드가 나옵니다. 단, 벤더가 의뢰한 시험 수치는 출발점일 뿐이라는 걸 먼저 말하고 고객 환경에서 다시 재세요. 금융 CISO에겐 '대출모집인·외주 페이지와 API를 다 아십니까?' — 10월 사고의 진입점입니다. 커머스엔 '어떤 에이전트를 들이고 어떤 걸 막을 겁니까?' — 아마존이 뮤즈를 막은 바로 그 질문. AI 조직엔 '에이전트가 어떤 MCP에 접근했는지 감사됩니까?', CIO엔 섀도 AI, 공공엔 업무 단위 전환 시험. (클릭) 공통점은 모두 가장자리와 게이트웨이의 문제라는 것. 스택이 위로 길어질수록 게이트웨이가 늘고, 그게 우리 자리입니다.", "app": false}, {"n": 14, "title": "고객에게 접근하는 방식이 바뀐다", "time": "23:15~26:15", "steps": 1, "note": "그래서 여러분 세 역할의 일이 이렇게 바뀝니다. Presales는 기능 데모에서 측정 PoC로 — 2주 PoC의 결과물은 슬라이드가 아니라 숫자입니다. 그리고 고객이 우리 제품의 보안을 물을 때 공급망·패치·하드닝을 사실과 조치로 설명할 준비가 돼 있어야 합니다(부록 3). Sales는 하드웨어 딜에서 플랫폼·구독 계약으로 — 인프라 딜의 모멘텀에 구독을 더하고, 대화 상대를 네트워크팀에서 CISO·AI 플랫폼팀·FinOps로 넓히고, 2027 예산 흐름으로 계정 지도를 그립니다. Marketing은 공포에서 증거로 — 메시지는 두 개면 충분합니다. 'GPU를 더 사기 전에 이미 산 GPU를 더 돌게', '에이전트에게 문을 열되 신분증을 확인하라'. 위협을 강조하기보다 고객이 얻은 결과를 보여 주는 쪽이 신뢰를 만듭니다. (클릭) 세 역할의 공통 문장 — 모든 미팅은 '무엇이 바뀌었나, 몇 %, 몇 건, 얼마'로 끝나야 합니다.", "app": false}, {"n": 15, "title": "소프트웨어 기업은 어떻게 움직이는가 — 30·90·365일", "time": "26:15~28:15", "steps": 2, "note": "내일부터의 순서입니다. 30일 — 사건이 식기 전에 대화를 엽니다. 금융 고객엔 가장자리 점검 오퍼, 설치 기반 고객엔 하드닝·버전 점검 콜. 우리 제품이 가장자리에 서 있다는 걸 잊지 마세요. 90일 — 산업별로 측정 PoC 하나씩, 결과는 공개 가능한 한국 레퍼런스로. 365일 — 2027 예산 사업에 국내 CSP·SI와 함께 '운영·보안 계층'으로 들어가고, 하드웨어 리프레시 고객을 구독으로 옮깁니다. (클릭) 매달 볼 숫자 셋 — 구독 첨부율, 숫자로 끝난 PoC의 전환율, AI 보안·에이전트 고객 수. (클릭) 하드웨어든 구독이든 고객은 같은 질문을 합니다 — 무엇을 바꿨고, 누가 책임지는가. KPI는 예시이니 내부 목표에 맞춰 조정하시면 됩니다.", "app": false}, {"n": 16, "title": "대한민국 AI·클라우드가 선택해야 할 방향", "time": "28:15~30:00", "steps": 3, "note": "마무리. 입장권은 샀지만 반만 쓰고 있다. 경기장은 더 위로 — 에이전트와 고객 접점으로 — 올라갔다. 보안을 전제로 순서를 병행하라. (클릭) GPU가 많아지면 강해지는가? 아니다. (클릭) 모델·로봇·에이전트를 가졌다고 AI 강국이 되는가? 그것도 아니다. (클릭) 그 지능으로 무엇을 바꿨는가, 그리고 누가 책임지는가가 결정합니다. 그리고 그 질문에 숫자로 답하게 돕는 것이, 게이트웨이에 서 있는 우리 소프트웨어 기업의 일입니다. 감사합니다.", "app": false}, {"n": 17, "title": "부록 — 예상 질문과 자료의 범위", "time": "", "steps": 0, "note": "질의응답용. 초판의 다섯 질문 그대로. 다섯째(Claude·OpenAI는 SaaS인가)는 13장 흐름과 이어서 답한다. '숫자의 범위'는 초판 숫자의 경계다.", "app": true}, {"n": 18, "title": "부록 — 10월 개정판 추가 질문", "time": "", "steps": 0, "note": "개정판에서 새로 나올 질문 넷 — 거품론, 뮤즈의 한국 상륙, 금융권 해킹의 AI 여부, 피지컬 AI 강점론. 해킹 AI 여부는 '확정 아님'을 먼저 말한다. 아래 '개정판 숫자의 범위'는 새 숫자들의 단서 목록이다.", "app": true}, {"n": 19, "title": "부록 — 소프트웨어 기업 세션 예상 질문", "time": "", "steps": 0, "note": "질의응답용. 첫 질문(우리 제품의 보안 사고·취약점)은 사실 순서대로 — 탐지 시점, 영향 범위, 패치, 외부 검증 결과 — 그리고 고객 하드닝으로 넘어간다. 언론 보도와 회사 공식 발표를 구분하고, 각 사 공식 메시지를 따른다.", "app": true}, {"n": 20, "title": "심화 — 미국: 수요가 먼저, 인프라는 나중", "time": "", "steps": 2, "note": "30분 본편에서 옮긴 심화 장. 미국의 순서 — SaaS(1999)→클라우드(2006)→플랫폼→AI 플랫폼→인프라 CAPEX. 7,250억 달러는 검증된 수요와 Lock-in 위에 올라간 돈. '인프라는 항상 나중'이 아니라는 단서(AWS는 수요 검증 전 인프라)도 함께.", "app": true}, {"n": 21, "title": "심화 — 중국: 응용·모델이 먼저, 인프라는 제약 속에서", "time": "", "steps": 4, "note": "심화. 중국 — 응용·플랫폼이 먼저, 오픈웨이트 모델로 생태계, 제재 속에서 인프라를 채운다. 알리바바 AI 관련 35%는 SaaS 비중이 아니라는 단서.", "app": true}, {"n": 22, "title": "심화 — 왜 순서가 문제인가 ① 마진은 위에서 나온다", "time": "", "steps": 2, "note": "30분 본편에서 옮긴 심화 장. 마진은 양 끝 — 칩 설계와 소프트웨어 — 에 몰립니다. 가운데 조립·임대 층은 매출이 폭증해도 마진을 못 가져갑니다. 지표가 섞여 있어 방향성 비교라는 점을 꼭 말해 주세요. 한국 예산이 가장 많이 가는 층이 마진이 가장 얇은 층입니다. GPU 임대의 교과서 CoreWeave 사례는 부록 8에 있습니다 — 9월에 30억 달러 전환사채를 또 냈고, 10월 8일 하루 8% 빠졌습니다.", "app": true}, {"n": 23, "title": "심화 — 왜 순서가 문제인가 ② AI Compute는 싸진다", "time": "", "steps": 4, "note": "30분 본편에서 옮긴 심화 장. 같은 성능의 토큰 값은 매년 10배씩 떨어집니다. GPU 세대는 1~2년마다 바뀝니다. (클릭) 한 가지 정정이 있습니다 — 초판에서 'H100 임대가는 2026년에 더 낮다'고 했는데, 실제로는 3.3달러 수준에서 하락이 멈췄고, 최신 B200은 공급 부족으로 비쌉니다. 비싼 건 최신뿐이고 1~2년이면 구세대가 됩니다. (클릭) 그리고 새 사실 — 토큰 단가가 내려도 작업당 비용은 오르기도 합니다. 원가의 단위는 토큰이 아니라 완료된 업무 1건입니다.", "app": true}, {"n": 24, "title": "심화 — 왜 순서가 문제인가 ③ CoreWeave", "time": "", "steps": 2, "note": "심화. CoreWeave — 매출 +170%에도 순손실 확대, 이자 12억 달러, MS 의존 67%. 개정: 2026.9.17 전환사채 30억 달러 추가, 10.8 OpenAI 매출 보도일 약 –8%. 질문이 '인프라만 파는 사업'으로 오면 이 장을 연다.", "app": true}, {"n": 25, "title": "심화 — 국내 CSP의 투자도 Stack 아래쪽에 머물러 있다", "time": "", "steps": 2, "note": "30분 본편에서 옮긴 심화 장. 기업 단위로 내려와도 같은 그림입니다. 10월 1일 K사는 2031년까지 1GW, N사는 AI 팩토리·네오클라우드를 발표했습니다 — 여전히 아래층 언어입니다. (클릭) 제품은 있습니다. 질문은 그 제품을 인프라 고객이 함께 쓰는가, 다시 쓰는가입니다. 강/중/약은 제 정성 평가입니다.", "app": true}, {"n": 26, "title": "심화 — 위층이 비어 있다 — 기업이 아니라 시장이 없었다", "time": "", "steps": 4, "note": "30분 본편에서 옮긴 심화 장. SaaS 시장 격차는 150~300배인데, 기업 단위 격차 130배보다 큽니다 — 기업이 못한 게 아니라 시장이 없었습니다. 2월 사스포칼립스 이후 가치는 좌석에서 에이전트·토큰으로 이동했고, 9월엔 ServiceNow 신규 계약의 절반이 비좌석이 됐습니다. 그 이동은 위층 안에서 일어났고, GPU 임대 마진으로 내려오지 않았습니다. 한국은 이전 판도, 다음 판도 비어 있습니다.", "app": true}, {"n": 27, "title": "심화 — 이중화도 없이 AI 데이터센터를 짓는 역설", "time": "", "steps": 3, "note": "30분 본편에서 옮긴 심화 장. 국정자원 화재가 꼭 1년 됐습니다. 2022년 이중화 예산을 돌려보냈고, 2025년 DR 예산은 30억이었습니다. (클릭) 709개 시스템이 멈췄고 완전 복구에 95일. (클릭) 10월 2일 1년 대책이 나왔습니다 — 핵심 13개 DR 착수, 121개 실시간 복제, 대전센터 2030년 폐쇄. 방향은 맞습니다. (클릭) 그런데 국감에서 경찰청 핵심 시스템 25개 중 20개가 아직 DR이 없었습니다. 질문은 같습니다 — 서버가 켜졌는가가 아니라 업무가 돌아왔는가, 그 시험 기록이 있는가.", "app": true}, {"n": 28, "title": "심화 — 주권은 GPU 장수가 아니라 모델·데이터·운영통제에서", "time": "", "steps": 2, "note": "30분 본편에서 옮긴 심화 장. 주권에는 다섯 층이 있는데 한국 담론은 Compute — GPU 장수 — 에 집중돼 있습니다. (클릭) EU와 일본·싱가포르는 컴퓨트와 자국 모델·운영통제를 한 세트로 설계합니다. 한국은 세트 중 컴퓨트만 앞서 있습니다.", "app": true}, {"n": 29, "title": "심화 — 모델까지 생겼는데, 무엇을 바꿨는지 말하지 못한다", "time": "", "steps": 1, "note": "30분 본편에서 옮긴 심화 장. 인프라도 있고 모델도 생겼는데 같은 문제가 반복됩니다. 기업의 커스텀 에이전트는 유지보수·DX 장벽·기술 주기 때문에 SI의 재탕이 되기 쉽습니다. 국가 단위로 옮기면 '모두의 AI'. 10월 베타, 12월 정식 출시이고, 공개된 목표는 3사 각 MAU 500만입니다. (클릭) 가입자와 질의 수는 토끼, 실제로 처리된 민원·업무가 호랑이 — 초판에서 우려했던 대로 목표가 토끼로 나왔습니다.", "app": true}, {"n": 30, "title": "심화 — 플랫폼 R&D는 있다 — 중복되고, 쓰는 곳이 없다", "time": "", "steps": 1, "note": "심화. K-클라우드 R&D(2026 제2차 자문 관찰) — 12개 과제 중 위층은 2개, 그마저 중복·미채택·민간부담 0. 4,000억·30개 이상은 추정(공식 집계 미확인)임을 밝힌다.", "app": true}, {"n": 31, "title": "심화 — 만드는 부처와 쓰는 부처가 다르다", "time": "", "steps": 2, "note": "심화. 만드는 부처(과기정통부)와 쓰는 부처(행안부)의 단절, 자문에서 낸 네 가지 제안 — 업스트림, PMO, 규모 검증, 피봇 가능한 거버넌스. ETRI×모빌린트 Ray 업스트림 머지(#6898)를 기준선으로.", "app": true}, {"n": 32, "title": "심화 — 세 번의 인계 — 완료 조건과 책임자가 보이는가", "time": "", "steps": 2, "note": "30분 본편에서 옮긴 심화 장. 지금까지의 장들은 한 구조입니다. 자원→서비스, 모델→제품, 시스템→업무 — 세 번의 인계마다 '완료'의 정의가 어긋납니다. (클릭) GPU 검수는 서비스가 아니고, 모델 공개는 제품이 아니고, 서버 복구는 업무 복구가 아닙니다. (클릭) 그래서 '몇 대 확보했나'와 함께 여섯 가지 증거를 봅니다 — 개방, 사용, 반복, 단위 결과, 책임, 복구. 7장 국감 숫자는 이 중 '사용'의 증거입니다.", "app": true}, {"n": 33, "title": "심화 — 그래도 '인프라가 먼저'라는 주장 — 근거와 한계", "time": "", "steps": 1, "note": "30분 본편에서 옮긴 심화 장. 반론을 정직하게 다룹니다. 네 가지 모두 부분적으로 맞습니다. (클릭) 그래서 결론은 '인프라를 멈추자'가 아니라 '사되, 위층 책임과 분리하지 말자'입니다. 거품론 질문이 나오면 부록 2로 답합니다.", "app": true}, {"n": 34, "title": "심화 — 수순 바로잡기 — 인프라를 사되, 플랫폼으로", "time": "", "steps": 1, "note": "30분 본편에서 옮긴 심화 장. 정책 쪽 처방(소프트웨어 기업 세션에서는 부록).  인프라를 멈추자는 게 아닙니다 — 전력 리드타임·안보 같은 반론은 모두 일리가 있고, 부록 17에 정직하게 정리했습니다. 핵심은 1번, 인프라 예산에 위층 배정을 묶는 것, 그리고 2번 공공 조달 SaaS First입니다. (클릭) 달라진 건 아래 임계치 — 가동률 50%는 이제 가정이 아니라 국감에서 확인된 현재값입니다. 이미 도달했다면 신규 CAPEX 전에 위층 배정부터 묶어야 합니다.", "app": true}, {"n": 35, "title": "심화 — 고객에게 접근하는 방식이 바뀐다(일반 IT판)", "time": "", "steps": 0, "note": "일반 IT 청중용 원본(기술직·영업직). 소프트웨어 기업 세션에서는 14장을 쓴다. 이제 오늘 오신 분들의 일로 옮깁니다. 고객의 첫 질문이 바뀌었습니다 — 어떤 모델을 쓰나가 아니라, 누가 책임지고, 사고 나면 어떻게 되고, 비용 상한은 얼마인가. 기술직은 모델이 아니라 하네스를 설계합니다 — 모델은 3~4주마다 바뀌는 부품이고, 에이전트는 신원과 권한을 가진 새로운 사용자이며, 점검은 가장자리부터입니다. 영업직은 장비가 아니라 바뀐 결과를 팝니다 — 견적 단위가 성과와 비용 상한으로 바뀌고, 과징금 10%와 72시간 통지가 영업 언어가 됐고, 2027 공공 예산은 아래층에 몰려 있으니 운영·플랫폼·성과를 붙여 제안합니다.", "app": true}, {"n": 36, "title": "심화 — 우리는 어떻게 대처하는가(일반 IT판)", "time": "", "steps": 2, "note": "일반 IT 청중용 원본. 소프트웨어 기업 세션에서는 15장을 쓴다. 그래서 내일부터 무엇을 하느냐. 30일은 지키기 — 우리 회사에서 어떤 AI 도구와 에이전트가 어떤 권한으로 돌고 있는지부터 봅니다. 90일은 재기 — 업무 하나를 골라 완료 1건의 지표와 원가를 먼저 잽니다. 365일은 바꾸기 — 2027 공공 수요에 성과형으로 들어가고, 에이전트에게 문을 열 준비를 합니다. (클릭) 매달 볼 숫자는 셋 — 끝낸 업무, 건당 원가, 막은 사고. (클릭) GPU를 파는 회사도 에이전트를 만드는 회사도 같은 질문을 받습니다 — 무엇을 바꿨고, 누가 책임지는가.", "app": true}, {"n": 37, "title": "Appendix — 주요 출처", "time": "", "steps": 0, "note": "질의응답용 초판 출처 목록. 발표 중에는 넘어가고, 질문이 나오면 참조.", "app": true}, {"n": 38, "title": "Appendix — 2026.10 개정판 추가 출처", "time": "", "steps": 0, "note": "질의응답용 개정판 출처 목록(2026.9.1~10.12). 2차 출처 수치는 각 장 출처란에 표시돼 있다.", "app": true}];
(function(){
  var list=document.getElementById('list'),jump=document.getElementById('jump');
  D.forEach(function(s){
    var id='s'+s.n;
    var a=document.createElement('a');a.href='#'+id;a.textContent=s.app?('부'+(s.n-16)):s.n;jump.appendChild(a);
    var c=document.createElement('article');c.className='card'+(s.app?' app':'');c.id=id;
    c.innerHTML='<div class="head"><div class="no"></div><div style="flex:1;min-width:0"><h2></h2><div class="chips"></div></div></div><p class="note"></p>';

    var ch=c.querySelector('.chips');
    function chip(t,cls,href){var e=document.createElement(href?'a':'span');e.className='chip '+cls;e.textContent=t;if(href){e.href=href;e.target='_blank';e.rel='noopener'}ch.appendChild(e)}
    if(s.time)chip('⏱ '+s.time,'t');

    chip('슬라이드 '+s.n+' ↗','go','../#'+s.n);

  });
  var fs=19;

  apply();

})();
